version: "3.9"
services:
  parser:
    build: .
    image: telegram-parser:latest
    volumes:
      - ./data:/in:ro
      - ./out:/out
    command: >
      /in 
      --words "нейросеть,нейронка,ИИ,алгоритм,бэкпроп,датасет,эмбеддинг,токен,GAN,автоэнкодер,генератор,LLM,GPT,ChatGPT,BERT,Gemini,Claude,Llama,Grok,OpenAI,DeepMind,Anthropic,NVIDIA,TensorFlow,PyTorch,промпт,галлюцинация" 
      --output /out/result.csv 
      --language russian
